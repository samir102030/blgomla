name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `tsc -b`, not `tsc --noEmit`. The root tsconfig.json is solution-style
      # ("files": [] plus references), so --noEmit resolves zero input files,
      # checks nothing, and exits 0. This step passed for months with type
      # errors sitting in the tree, and let a ReferenceError reach the browser
      # — vite build strips types without checking them, so it caught nothing
      # either. Build mode follows the references and actually reads src/.
      - name: TypeScript typecheck
        run: npx tsc -b --force
      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://halafawystore-backend.vercel.app/api/

  backend:
    name: Backend — syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Node module syntax check
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*" -not -path "./scripts/*"); do
            node --check "$f"
          done
