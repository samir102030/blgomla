<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strip Referer header so hotlink-protected image CDNs (TP-Link, Hikvision, etc.) serve images embedded on this site -->
    <meta name="referrer" content="no-referrer" />
    <title>Belgomla — IT & Networking Marketplace</title>
    <meta name="description" content="Egypt's premier marketplace for IT, networking, and technology products. Shop routers, switches, cables, servers, and more at the best prices." />

    <!-- Favicon: SVG for modern browsers (scales crisply) + multi-size ICO for
         legacy + PNG fallbacks -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <!-- Apple touch icon: 180×180 on solid background so iOS doesn't apply
         its rounded-rect mask over transparent corners -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- PWA manifest. The runtime i18n layer swaps href to /manifest.ar.json
         when the user toggles Arabic, so install dialogs in AR show the
         localized name + direction. -->
    <link id="webmanifest" rel="manifest" href="/manifest.json" />
    <!-- theme-color drives the Android status bar + iOS PWA standalone bar;
         keep this in sync with manifest.json -->
    <meta name="theme-color" content="#002B5B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Belgomla" />
    <meta name="application-name" content="Belgomla" />

    <!-- Open Graph: landscape 1200×630 image renders properly on FB/LinkedIn/etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Belgomla — IT & Networking Marketplace" />
    <meta property="og:description" content="Egypt's premier marketplace for IT, networking, and technology products." />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icons/og-image.png" />

    <!-- Preconnect to backend so the TLS handshake happens in parallel with HTML parsing -->
    <link rel="preconnect" href="https://halafawystore-backend.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://halafawystore-backend.vercel.app" />

    <!-- Preconnect to Cloudinary so the first product-image TLS handshake starts before
         any <img> tag is parsed. Saves ~50-100ms on slow mobile. -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Google Fonts — load asynchronously to avoid 650ms of render-blocking.
         The "print" trick: stylesheet downloads in background; onload swaps media back to "all".
         Three faces, each with a job: Reem Kufi is the display voice (geometric
         kufic, cut for Arabic rather than borrowed from Latin), IBM Plex Sans
         Arabic carries body copy in both scripts, and IBM Plex Mono sets the
         numerals and technical labels. This replaces Inter + Cairo + DM Sans,
         which were three unrelated families loaded from three separate
         requests — two of them by @import inside CSS, which blocks until the
         stylesheet itself has parsed. One request now, one family system.
         Weights stop at 700: nothing in the CSS may ask for 800, or the
         browser synthesises the bold and the kufic loses its edges. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
