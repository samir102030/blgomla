<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strip Referer header so hotlink-protected image CDNs (TP-Link, Hikvision, etc.) serve images embedded on this site -->
    <meta name="referrer" content="no-referrer" />
    <title>Belgomla — IT & Networking Marketplace</title>
    <meta name="description" content="Egypt's premier marketplace for IT, networking, and technology products. Shop routers, switches, cables, servers, and more at the best prices." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#002B5B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Belgomla" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Belgomla — IT & Networking Marketplace" />
    <meta property="og:description" content="Egypt's premier marketplace for IT, networking, and technology products." />
    <meta property="og:image" content="/logo.png" />

    <!-- Preconnect to backend so the TLS handshake happens in parallel with HTML parsing -->
    <link rel="preconnect" href="https://halafawystore-backend.vercel.app" crossorigin />
    <link rel="dns-prefetch" href="https://halafawystore-backend.vercel.app" />

    <!-- Google Fonts (Inter) — load asynchronously to avoid 650ms of render-blocking.
         The "print" trick: stylesheet downloads in background; onload swaps media back to "all". -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker disabled — was caching old JS chunks and intercepting
      // signup/login requests, causing forever-hanging UI. Unregister any
      // existing SW to undo damage from previous deploys.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((r) => r.unregister());
        }).catch(() => {});
      }
    </script>
  </body>
</html>
