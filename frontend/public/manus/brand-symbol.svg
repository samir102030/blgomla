<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Belgomla">
  <!--
    The same artwork as the app icon in /icon.svg — rounded square, the B with
    its bag handle — so the mark in the header and the one on a home screen are
    the same logo rather than two drawings of the same letter.

    Painted in the site's accent (#00A8E8, the value behind the legacy
    `--orange` token) with the letter in white: on this blue the near-black of
    the app icon comes to about 3.9:1, and white to 5:1.
  -->
  <rect width="512" height="512" rx="112" fill="#00A8E8"/>
  <g transform="translate(120,103) scale(1.7)">
    <path d="M54 22 Q54 0 80 0 Q106 0 106 22" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path fill-rule="evenodd" fill="#FFFFFF" d="M22 22 L84 22 C108 22 122 38 122 58 C122 72 114 82 102 86 C118 90 130 102 130 120 C130 142 112 160 86 160 L22 160 Z M46 44 L46 76 L82 76 C92 76 98 68 98 60 C98 50 92 44 82 44 Z M46 100 L46 138 L84 138 C96 138 104 130 104 120 C104 110 96 100 84 100 Z"/>
  </g>
</svg>
